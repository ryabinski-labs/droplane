<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="196" y1="120" x2="860" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D3239"/>
      <stop offset="0.52" stop-color="#1A1D21"/>
      <stop offset="1" stop-color="#0F1114"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FCF7EC"/>
      <stop offset="1" stop-color="#EAE0CD"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1C2025"/>
      <stop offset="0.55" stop-color="#14171B"/>
      <stop offset="1" stop-color="#0C0E10"/>
    </linearGradient>
    <linearGradient id="lime" x1="390" y1="370" x2="630" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCFF70"/>
      <stop offset="0.55" stop-color="#C8F94A"/>
      <stop offset="1" stop-color="#B4EA2D"/>
    </linearGradient>
    <linearGradient id="limeFold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A8D92C"/>
      <stop offset="1" stop-color="#8DBA1E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#C8FF3D" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#C8FF3D" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C8FF3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="shade" x1="512" y1="500" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="ambient" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="fileShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="bodyClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- ambient shadow -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000" opacity="0.45" filter="url(#ambient)"/>

  <!-- body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#bodyClip)">
    <!-- atmosphere -->
    <circle cx="500" cy="510" r="280" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#shade)"/>

    <g transform="translate(512 512) scale(0.95 1) translate(-512 -512)">
    <!-- phone -->
    <rect x="140" y="295" width="200" height="430" rx="46" fill="url(#ivory)"/>
    <rect x="178" y="333" width="124" height="354" rx="26" fill="url(#screen)"/>
    <circle cx="240" cy="311" r="3.5" fill="#14171B" opacity="0.85"/>

    <!-- monitor -->
    <rect x="560" y="295" width="320" height="250" rx="28" fill="url(#ivory)"/>
    <rect x="600" y="335" width="240" height="170" rx="12" fill="url(#screen)"/>
    <path d="M 672 545 H 768 L 778 615 H 662 Z" fill="url(#ivory)"/>
    <rect x="630" y="615" width="180" height="18" rx="9" fill="url(#ivory)"/>
    <circle cx="720" cy="315" r="3.5" fill="#14171B" opacity="0.8"/>

    <!-- motion streaks -->
    <path d="M 342 470 L 368 464" stroke="#C8F94A" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    <path d="M 342 510 L 372 503" stroke="#C8F94A" stroke-width="14" stroke-linecap="round" opacity="0.78"/>
    <path d="M 342 550 L 366 544" stroke="#C8F94A" stroke-width="14" stroke-linecap="round" opacity="0.6"/>

    <!-- document -->
    <g transform="translate(500 510) rotate(-12)" filter="url(#fileShadow)">
      <path d="M -82 -135 H 50 L 100 -85 V 117 Q 100 135 82 135 H -82 Q -100 135 -100 117 V -117 Q -100 -135 -82 -135 Z" fill="url(#lime)"/>
      <path d="M 50 -135 L 100 -85 L 50 -85 Z" fill="url(#limeFold)"/>
      <path d="M 50 -135 L 100 -85 L 50 -85 Z" fill="#000000" opacity="0.12"/>
      <path d="M 50 -135 L 100 -85" stroke="#EEFFB0" stroke-opacity="0.55" stroke-width="2.5"/>
    </g>
    </g>

    <!-- rim -->
    <rect x="101" y="101" width="822" height="822" rx="184" stroke="url(#rim)" stroke-width="2"/>
  </g>
</svg>
