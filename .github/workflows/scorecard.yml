name: Scorecard

# publish_results feeds scorecard.dev and the README badge. The API rejects results unless this
# workflow has no top-level env/defaults or write permissions, the job runs on a GitHub-hosted Ubuntu
# runner (not self-hosted), and the job only uses checkout, upload-artifact, upload-sarif,
# scorecard-action, and harden-runner.
on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read # read workflow definitions for the checks
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      id-token: write # sign results published to scorecard.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Branch-Protection reads -1 without an admin-read token. Add a fine-grained PAT
          # (Administration: read) as SCORECARD_TOKEN only once the ruleset requires approvals;
          # a CI-only ruleset scores 3/10 and lowers the aggregate.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
