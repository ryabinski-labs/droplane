name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    runs-on: macos-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign provenance with Sigstore
      attestations: write # store the attestation on GitHub
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libmtp
        run: brew install libmtp

      # Ad-hoc signed until a Developer ID certificate exists, so the release is marked pre-release.
      - name: Build the app and zip it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/make-app.sh
          codesign --verify --deep --strict build/Droplane.app
          if otool -L build/Droplane.app/Contents/MacOS/Droplane build/Droplane.app/Contents/Frameworks/*.dylib | grep -q /opt/homebrew; then
            echo "app links against Homebrew paths" >&2; exit 1
          fi
          mkdir -p dist
          ditto -c -k --keepParent build/Droplane.app "dist/Droplane-${TAG}-arm64.zip"
          git archive --format=tar.gz --prefix="droplane-${TAG}/" -o "dist/droplane-${TAG}-source.tar.gz" "$TAG"
          (cd dist && shasum -a 256 ./* > SHA256SUMS.txt)

      - name: Generate SLSA provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The bundle is JSON lines of Sigstore-signed in-toto SLSA provenance. Verify with:
      # gh attestation verify <asset> --repo OWNER/REPO --bundle <tag>.intoto.jsonl
      - name: Create draft release, attach assets, publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/${GITHUB_REPOSITORY#*/}-${TAG}.intoto.jsonl"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag --generate-notes
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
