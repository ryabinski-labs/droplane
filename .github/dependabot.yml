version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Version updates wait a week so a compromised release can be caught first; security updates are immediate.
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
